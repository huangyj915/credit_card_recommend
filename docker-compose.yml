services:
  web:
    build: .
    container_name: credit-card-recommend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - PUBLIC_READONLY=${PUBLIC_READONLY:-false}
      - DISABLE_DOCS=${DISABLE_DOCS:-false}
